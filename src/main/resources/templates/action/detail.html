<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&eacute;tail action</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">D&eacute;tail action</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/actions}" class="btn btn-outline-secondary">Retour</a>
                <a th:if="${action != null}" th:href="@{/actions/edit/{id}(id=${action.id})}" class="btn btn-primary">Modifier</a>
            </div>
        </div>

        <div th:if="${action == null}" class="alert alert-warning">Action introuvable.</div>

        <div th:if="${action != null}" class="row g-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="d-flex align-items-start justify-content-between gap-3">
                            <div>
                                <h3 class="mb-1" th:text="${action.titre}"></h3>
                                <div class="text-muted">
                                    <i class="bi bi-geo-alt"></i> <span th:text="${action.lieu}"></span>
                                </div>
                            </div>
                            <div>
                                <span class="badge"
                                      th:classappend="'badge-status-' + ${action.status.toString().toLowerCase()}"
                                      th:text="${action.status}"></span>
                            </div>
                        </div>

                        <hr class="my-4">

                        <p class="mb-4" th:text="${action.description}"></p>

                        <div class="row g-3">
                            <div class="col-md-6">
                                <div class="text-muted">Dates</div>
                                <div class="fw-semibold">
                                    <span th:text="${#dates.format(action.dateDebut, 'dd/MM/yyyy')}"></span>
                                    -
                                    <span th:text="${#dates.format(action.dateFin, 'dd/MM/yyyy')}"></span>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Organisation</div>
                                <div class="fw-semibold" th:text="${action.organisation != null ? action.organisation.nom : ''}"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Cat&eacute;gorie</div>
                                <div class="fw-semibold" th:text="${action.categorie != null ? action.categorie.nom : ''}"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Objectif</div>
                                <div class="fw-semibold">
                                    <span th:text="${#numbers.formatDecimal(action.objectifCollect, 1, 'POINT', 2, 'SPACE')}"></span> MAD
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Somme actuelle</div>
                                <div class="fw-semibold">
                                    <span th:text="${#numbers.formatDecimal(action.sommeActuelle, 1, 'POINT', 2, 'SPACE')}"></span> MAD
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Progression</div>
                                <div class="fw-semibold" th:text="${#numbers.formatDecimal(progression, 1, 'POINT', 0, 'COMMA')} + '%'"></div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <div class="progress">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${progression} + '%'"
                                     th:text="${#numbers.formatDecimal(progression, 1, 'POINT', 0, 'COMMA')} + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-transparent">
                        <h5 class="card-title mb-0">Actions</h5>
                    </div>
                    <div class="card-body d-grid gap-2">
                        <a th:href="@{/actions/edit/{id}(id=${action.id})}" class="btn btn-outline-primary">Modifier</a>
                        <a th:href="@{/actions/delete/{id}(id=${action.id})}" class="btn btn-outline-danger"
                           onclick="return confirm('Etes-vous sur ?')">Supprimer</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
