<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}">
<head th:replace="~{fragments/head :: head(#{action.list.title})}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0" th:text="#{action.list.title}">Liste des Actions de Charité</h1>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/actions/create}"
               class="btn btn-primary" th:text="#{action.new}">Nouvelle Action</a>
        </div>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                    <option value="" th:text="#{action.filter.status}">Tous statuts</option>
                    <option value="BROUILLON" th:text="#{action.status.draft}">Brouillon</option>
                    <option value="PUBLIEE" th:text="#{action.status.published}">Publiée</option>
                    <option value="EN_COURS" th:text="#{action.status.ongoing}">En cours</option>
                    <option value="TERMINEE" th:text="#{action.status.done}">Terminée</option>
                    <option value="ARCHIVEE" th:text="#{action.status.archived}">Archivée</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchInput" th:placeholder="#{action.search.placeholder}">
            </div>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div th:each="action : ${actions}" class="col">
                <div class="card action-card h-100 border-0 shadow-sm position-relative"
                     th:onclick="|window.location.href='@{/actions/{id}(id=${action.id})}'|"
                     style="cursor: pointer;">

                    <img class="card-img-top"
                         th:src="${action.imagePrincipale != null ? action.imagePrincipale : 'https://picsum.photos/seed/' + action.id + '/400/200.jpg'}"
                         alt="Action image" style="height: 160px; object-fit: cover;">

                    <div class="card-body p-3 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge" th:classappend="'badge-status-' + ${action.status.toString().toLowerCase()}"
                                  th:text="${action.status}"></span>
                            <small class="text-muted"><i class="bi bi-geo-alt"></i> <span th:text="${action.lieu}"></span></small>
                        </div>
                        <h6 class="card-title fw-bold mb-3 text-truncate" th:title="${action.titre}" th:text="${action.titre}"></h6>

                        <div class="mt-auto">
                            <div class="d-flex justify-content-between mb-1">
                                <small class="fw-bold text-primary"
                                       th:text="${progression[action.id] != null ? #numbers.formatDecimal(progression[action.id], 1, 0) : '0'} + '%'"></small>
                                <small class="text-muted"
                                       th:text="${action.objectifCollect != null ? #numbers.formatDecimal(action.objectifCollect, 1, 0) : '0'} + ' DH'"></small>
                            </div>
                            <div class="progress mb-2" style="height: 6px;">
                                <div class="progress-bar" role="progressbar"
                                     th:style="'width: ' + ${progression[action.id]} + '%'"></div>
                            </div>

                            <div th:if="${isAdmin or (userOrgId != null and action.organisation != null and userOrgId == action.organisation.id)}"
                                 class="position-absolute top-0 end-0 p-2" onclick="event.stopPropagation();">
                                <a th:href="@{/actions/edit/{id}(id=${action.id})}"
                                   class="btn btn-sm btn-white shadow-sm border-0 rounded-circle"
                                   style="width: 32px; height: 32px; display: grid; place-items: center; background: rgba(255,255,255,0.9);">
                                    <i class="bi bi-pencil-fill text-dark small"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${actions.isEmpty()}" class="text-center py-5">
            <div class="card p-5 border-0 shadow-sm rounded-3">
                <h3 th:text="#{action.none.found}">Aucune action trouvée</h3>
                <p class="text-muted" th:text="#{action.none.desc}">Commencez par créer votre première action.</p>
                <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/actions/create}"
                   class="btn btn-primary mt-3" th:text="#{action.create}">Créer une action</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/public-footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            document.querySelectorAll('.action-card').forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                card.closest('.col').style.display = title.includes(searchTerm) ? 'block' : 'none';
            });
        });

        document.getElementById('statusFilter').addEventListener('change', (e) => {
            const status = e.target.value;
            document.querySelectorAll('.action-card').forEach(card => {
                const badge = card.querySelector('.badge');
                card.closest('.col').style.display = (!badge || status === '' || badge.textContent === status) ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
