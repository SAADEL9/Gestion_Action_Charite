<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Actions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="layout/navbar :: navbar"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Liste des Actions de Charité</h1>
            <a th:href="@{/actions/create}" class="btn btn-primary">+ Nouvelle Action</a>
        </div>

        <!-- Filters -->
        <div class="row mb-4">
            <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                    <option value="">Tous statuts</option>
                    <option value="BROUILLON">Brouillon</option>
                    <option value="PUBLIEE">Publiée</option>
                    <option value="EN_COURS">En cours</option>
                    <option value="TERMINEE">Terminée</option>
                    <option value="ARCHIVEE">Archivée</option>
                </select>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" id="searchInput" placeholder="Rechercher...">
            </div>
        </div>

        <!-- Actions Grid -->
        <div class="row">
            <div th:each="action : ${actions}" class="col-md-4 mb-4">
                <div class="card action-card">
                    <img class="card-img-top" th:src="'https://picsum.photos/seed/' + ${action.id} + '/400/200.jpg'" alt="Action image">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${action.titre}"></h5>
                        <p class="card-text" th:text="${action.description.length() > 100 ? action.description.substring(0, 100) + '...' : action.description}"></p>

                        <!-- Progress Bar -->
                        <div class="mb-3">
                            <small class="text-muted">Progression: <span th:text="${#numbers.formatDecimal(progression[action.id], 1, 'POINT', 0, 'COMMA')} + '%'"></span></small>
                            <div class="progress">
                                <div class="progress-bar" role="progressbar" th:style="'width: ' + ${progression[action.id]} + '%'" th:text="${#numbers.formatDecimal(progression[action.id], 1, 'POINT', 0, 'COMMA')} + '%'"></div>
                            </div>
                        </div>

                        <!-- Action Details -->
                        <div class="mb-2">
                            <small class="text-muted">
                                <i class="bi bi-calendar"></i> Du <span th:text="${#dates.format(action.dateDebut, 'dd/MM/yyyy')}"></span> au <span th:text="${#dates.format(action.dateFin, 'dd/MM/yyyy')}"></span>
                            </small>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">
                                <i class="bi bi-geo-alt"></i> <span th:text="${action.lieu}"></span>
                            </small>
                        </div>
                        <div class="mb-2">
                            <small class="text-muted">
                                <i class="bi bi-building"></i> <span th:text="${action.organisation != null ? action.organisation.nom : 'Non spécifié'}"></span>
                            </small>
                        </div>

                        <!-- Status Badge -->
                        <span class="badge mb-2" 
                              th:classappend="'badge-status-' + ${action.status.toString().toLowerCase()}"
                              th:text="${action.status}"></span>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-2">
                            <a th:href="@{/actions/{id}(id=${action.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                            <a th:href="@{/actions/edit/{id}(id=${action.id})}" class="btn btn-sm btn-outline-secondary">Modifier</a>
                            <div th:if="${action.status.toString() == 'BROUILLON'}">
                                <a th:href="@{/actions/publier/{id}(id=${action.id})}" class="btn btn-sm btn-success">Publier</a>
                            </div>
                            <div th:if="${action.status.toString() == 'PUBLIEE' || action.status.toString() == 'EN_COURS'}">
                                <a th:href="@{/actions/archiver/{id}(id=${action.id})}" class="btn btn-sm btn-warning">Archiver</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- No results message -->
        <div th:if="${actions.isEmpty()}" class="text-center py-5">
            <div class="card p-5">
                <h3>Aucune action trouvée</h3>
                <p class="text-muted">Commencez par créer votre première action de charité.</p>
                <a th:href="@{/actions/create}" class="btn btn-primary mt-3">Créer une action</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.action-card');

            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                const description = card.querySelector('.card-text').textContent.toLowerCase();

                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    card.closest('.col-md-4').style.display = 'block';
                } else {
                    card.closest('.col-md-4').style.display = 'none';
                }
            });
        });

        // Status filter
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            const status = e.target.value;
            const cards = document.querySelectorAll('.action-card');

            cards.forEach(card => {
                const badge = card.querySelector('.badge');
                if (!badge || status === '' || badge.textContent === status) {
                    card.closest('.col-md-4').style.display = 'block';
                } else {
                    card.closest('.col-md-4').style.display = 'none';
                }
            });
        });
    </script>

</body>
</html>
