<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Liste des Actions')}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">Liste des Actions de Charit&eacute;</h1>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/actions/create}" class="btn btn-primary">Nouvelle Action</a>
        </div>

        <!-- Filters -->
        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <select class="form-select" id="statusFilter">
                    <option value="">Tous statuts</option>
                    <option value="BROUILLON">Brouillon</option>
                    <option value="PUBLIEE">Publi&eacute;e</option>
                    <option value="EN_COURS">En cours</option>
                    <option value="TERMINEE">Termin&eacute;e</option>
                    <option value="ARCHIVEE">Archiv&eacute;e</option>
                </select>
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" id="searchInput" placeholder="Rechercher...">
            </div>
        </div>

        <!-- Actions Grid -->
        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
            <div th:each="action : ${actions}" class="col">
                <div class="card action-card h-100 border-0 shadow-sm position-relative" 
                     th:onclick="|window.location.href='@{/actions/{id}(id=${action.id})}'|"
                     style="cursor: pointer;">
                    
                    <img class="card-img-top" th:src="${action.imagePrincipale != null ? action.imagePrincipale : 'https://picsum.photos/seed/' + action.id + '/400/200.jpg'}" alt="Action image" style="height: 160px; object-fit: cover;">
                    
                    <div class="card-body p-3 d-flex flex-column">
                        <div class="d-flex justify-content-between align-items-start mb-2">
                            <span class="badge" th:classappend="'badge-status-' + ${action.status.toString().toLowerCase()}" th:text="${action.status}"></span>
                            <small class="text-muted"><i class="bi bi-geo-alt"></i> <span th:text="${action.lieu}"></span></small>
                        </div>
                        <h6 class="card-title fw-bold mb-3 text-truncate" th:title="${action.titre}" th:text="${action.titre}"></h6>
                        
                        <div class="mt-auto">
                            <div class="d-flex justify-content-between mb-1">
                                <small class="fw-bold text-primary" th:text="${progression[action.id] != null ? #numbers.formatDecimal(progression[action.id], 1, 0) : '0'} + '%'"></small>
                                <small class="text-muted" th:text="${action.objectifCollect != null ? #numbers.formatDecimal(action.objectifCollect, 1, 0) : '0'} + ' DH'"></small>
                            </div>
                            <div class="progress mb-2" style="height: 6px;">
                                <div class="progress-bar" role="progressbar" th:style="'width: ' + ${progression[action.id]} + '%'"></div>
                            </div>
                            
                            <!-- Admin Actions Overlay-style -->
                            <div th:if="${isAdmin or (userOrgId != null and action.organisation != null and userOrgId == action.organisation.id)}" 
                                 class="position-absolute top-0 end-0 p-2" onclick="event.stopPropagation();">
                                <a th:href="@{/actions/edit/{id}(id=${action.id})}" class="btn btn-sm btn-white shadow-sm border-0 rounded-circle" style="width: 32px; height: 32px; display: grid; place-items: center; background: rgba(255,255,255,0.9);">
                                    <i class="bi bi-pencil-fill text-dark small"></i>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- No results message -->
        <div th:if="${actions.isEmpty()}" class="text-center py-5">
            <div class="card p-5 border-0 shadow-sm rounded-3">
                <h3>Aucune action trouv&eacute;e</h3>
                <p class="text-muted">Commencez par cr&eacute;er votre premi&egrave;re action de charit&eacute;.</p>
                <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/actions/create}" class="btn btn-primary mt-3">Cr&eacute;er une action</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/public-footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Simple search functionality
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const cards = document.querySelectorAll('.action-card');

            cards.forEach(card => {
                const title = card.querySelector('.card-title').textContent.toLowerCase();
                if (title.includes(searchTerm)) {
                    card.closest('.col').style.display = 'block';
                } else {
                    card.closest('.col').style.display = 'none';
                }
            });
        });

        // Status filter
        document.getElementById('statusFilter').addEventListener('change', (e) => {
            const status = e.target.value;
            const cards = document.querySelectorAll('.action-card');

            cards.forEach(card => {
                const badge = card.querySelector('.badge');
                if (!badge || status === '' || badge.textContent === status) {
                    card.closest('.col').style.display = 'block';
                } else {
                    card.closest('.col').style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
