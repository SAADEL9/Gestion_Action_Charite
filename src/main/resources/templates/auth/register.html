<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="layout/navbar :: navbar"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-10 col-lg-6">
                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="page-title h3 mb-3">Inscription</h1>

                        <form th:action="@{/register}" th:object="${user}" method="post" class="needs-validation" novalidate>
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="nom">Nom *</label>
                                        <input id="nom" type="text" class="form-control" th:field="*{nom}" required>
                                        <div class="invalid-feedback">Veuillez fournir un nom.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="prenom">Prenom *</label>
                                        <input id="prenom" type="text" class="form-control" th:field="*{prenom}" required>
                                        <div class="invalid-feedback">Veuillez fournir un prenom.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Email *</label>
                                <input id="email" type="email" class="form-control" th:field="*{email}" required>
                                <div class="invalid-feedback">Veuillez fournir un email.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="motDePasse">Mot de passe *</label>
                                <input id="motDePasse" type="password" class="form-control" th:field="*{motDePasse}" required>
                                <div class="invalid-feedback">Veuillez fournir un mot de passe.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">S'inscrire</button>
                                <a th:href="@{/login}" class="btn btn-outline-secondary">Deja un compte ? Se connecter</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
