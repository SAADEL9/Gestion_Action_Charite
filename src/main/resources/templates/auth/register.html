<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Inscription')}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

<main class="auth-wrapper">
    <div class="auth-card-wide">
        <div class="card-surface p-4 p-lg-5">
            <div class="text-center mb-4">
                <div class="brand-mark mb-2 justify-content-center">
                    <img th:src="@{/images/logo-charite.png}" alt="Charite">
                    <span>Charite</span>
                </div>
                <h1 class="h3 fw-bold">Créer un compte</h1>
                <p class="text-muted">Rejoignez notre communauté solidaire</p>
            </div>

            <form th:action="@{/register}" th:object="${user}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label" for="nom">Nom *</label>
                        <div class="premium-input">
                            <input id="nom" type="text" class="form-control" th:field="*{nom}" placeholder="Votre nom" required>
                        </div>
                        <div class="invalid-feedback">Veuillez fournir un nom.</div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label" for="prenom">Prénom *</label>
                        <div class="premium-input">
                            <input id="prenom" type="text" class="form-control" th:field="*{prenom}" placeholder="Votre prénom" required>
                        </div>
                        <div class="invalid-feedback">Veuillez fournir un prénom.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="email">Email *</label>
                    <div class="premium-input">
                        <input id="email" type="email" class="form-control" th:field="*{email}" placeholder="nom@exemple.com" required>
                    </div>
                    <div class="invalid-feedback">Veuillez fournir un email valide.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="motDePasse">Mot de passe *</label>
                    <div class="premium-input">
                        <input id="motDePasse" type="password" class="form-control" th:field="*{motDePasse}" placeholder="••••••••" required>
                    </div>
                    <div class="invalid-feedback">Veuillez fournir un mot de passe (min 6 caractères).</div>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-success-pill btn-lg">S'inscrire</button>
                    <div class="text-center">
                        <span class="text-muted small">Déjà un compte ?</span>
                        <a th:href="@{/login}" class="text-primary small fw-bold ms-1">Se connecter</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
