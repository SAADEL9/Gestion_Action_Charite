<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Connexion')}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

<main class="auth-wrapper">
    <div class="auth-card">
        <div class="card-surface p-4 p-lg-5">
            <div class="text-center mb-4">
                <div class="brand-mark mb-2 justify-content-center">
                    <img th:src="@{/images/logo-charite.png}" alt="Charite">
                    <span>Charite</span>
                </div>
                <h1 class="h3 fw-bold">Bienvenue</h1>
                <p class="text-muted">Connectez-vous pour continuer</p>
            </div>

            <div th:if="${param.error}" class="alert alert-danger border-0 rounded-4 small mb-3">
                <i class="bi bi-exclamation-circle me-2"></i> Email ou mot de passe incorrect.
            </div>
            <div th:if="${param.logout}" class="alert alert-success border-0 rounded-4 small mb-3">
                <i class="bi bi-check-circle me-2"></i> Vous êtes déconnecté.
            </div>
            <div th:if="${param.registered}" class="alert alert-success border-0 rounded-4 small mb-3">
                <i class="bi bi-check-circle me-2"></i> Compte créé. Veuillez vous connecter.
            </div>

            <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                
                <div class="mb-3">
                    <label class="form-label" for="email">Email</label>
                    <div class="premium-input">
                        <input id="email" type="email" name="email" class="form-control" placeholder="nom@exemple.com" required>
                    </div>
                    <div class="invalid-feedback">Veuillez fournir un email valide.</div>
                </div>

                <div class="mb-4">
                    <label class="form-label" for="motDePasse">Mot de passe</label>
                    <div class="premium-input">
                        <input id="motDePasse" type="password" name="motDePasse" class="form-control" placeholder="••••••••" required>
                    </div>
                    <div class="invalid-feedback">Veuillez fournir un mot de passe.</div>
                </div>

                <div class="d-grid gap-3">
                    <button type="submit" class="btn btn-success-pill btn-lg">Se connecter</button>
                    <div class="text-center">
                        <span class="text-muted small">Nouveau sur Charite ?</span>
                        <a th:href="@{/register}" class="text-primary small fw-bold ms-1">Créer un compte</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    (function () {
        'use strict'
        var forms = document.querySelectorAll('.needs-validation')
        Array.prototype.slice.call(forms).forEach(function (form) {
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                }
                form.classList.add('was-validated')
            }, false)
        })
    })()
</script>
</body>
</html>
