<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-5">
                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="page-title h3 mb-3">Connexion</h1>

                        <div th:if="${param.error}" class="alert alert-danger">
                            Email ou mot de passe incorrect.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success">
                            Vous etes deconnecte.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success">
                            Compte cree. Veuillez vous connecter.
                        </div>

                        <form th:action="@{/login}" method="post" class="needs-validation" novalidate>
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <div class="mb-3">
                                <label class="form-label" for="email">Email</label>
                                <input id="email" type="email" name="email" class="form-control" required>
                                <div class="invalid-feedback">Veuillez fournir un email.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="motDePasse">Mot de passe</label>
                                <input id="motDePasse" type="password" name="motDePasse" class="form-control" required>
                                <div class="invalid-feedback">Veuillez fournir un mot de passe.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary">Se connecter</button>
                                <a th:href="@{/register}" class="btn btn-outline-secondary">Creer un compte</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
