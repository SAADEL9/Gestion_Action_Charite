<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - Gestion Action de Charité</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 100px 0;
            margin-bottom: 50px;
        }
        .stat-card {
            background: white;
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
            text-align: center;
        }
        .stat-card:hover {
            transform: translateY(-5px);
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
        }
        .action-card {
            border: none;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.3s;
            margin-bottom: 20px;
        }
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .action-card .card-img-top {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero-section">
        <div class="container text-center">
            <h1 class="display-4 mb-4">Bienvenue sur notre plateforme</h1>
            <p class="lead mb-4">Gestion efficace des actions de charité et des dons</p>
            <a th:href="@{/actions}" class="btn btn-light btn-lg">Voir toutes les actions</a>
        </div>
    </section>

    <!-- Stats Section -->
    <section class="container mb-5">
        <div class="row">
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-number" th:text="${totalActions}">0</div>
                    <h5>Actions</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-number" th:text="${totalDons}">0</div>
                    <h5>Total Dons</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-number" th:text="${totalParticipants}">0</div>
                    <h5>Participants</h5>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card">
                    <div class="stat-number" th:text="${totalOrganisations}">0</div>
                    <h5>Organisations</h5>
                </div>
            </div>
        </div>
    </section>

    <!-- Recent Actions -->
    <section class="container mb-5">
        <h2 class="mb-4">Actions récentes</h2>
        <div class="row">
            <div th:each="action : ${recentActions}" class="col-md-4">
                <div class="card action-card">
                    <img class="card-img-top" th:src="'https://picsum.photos/seed/' + ${action.id} + '/400/200.jpg'" alt="Action image">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${action.titre}"></h5>
                        <p class="card-text" th:text="${action.description.length() > 100 ? action.description.substring(0, 100) + '...' : action.description}"></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-primary" th:text="${action.status}"></span>
                            <a th:href="@{/actions/{id}(id=${action.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="bg-light py-5">
        <div class="container text-center">
            <h2>Rejoignez notre mission</h2>
            <p class="lead">Participez à des actions humanitaires qui changent des vies</p>
            <a th:href="@{/actions}" class="btn btn-primary btn-lg">Explorer les actions</a>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
