<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${categorie != null and categorie.id != null ? 'Modifier catégorie' : 'Nouvelle catégorie'}"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <h1 class="page-title mb-4" th:text="${categorie != null and categorie.id != null ? 'Modifier catégorie' : 'Nouvelle catégorie'}"></h1>

        <form th:action="${categorie != null and categorie.id != null ? '/categories/edit/' + categorie.id : '/categories/create'}"
              th:object="${categorie}" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="nom" class="form-label">Nom *</label>
                                <input id="nom" class="form-control" type="text" th:field="*{nom}" required>
                                <div class="invalid-feedback">Veuillez fournir un nom.</div>
                            </div>

                            <div class="mb-0">
                                <label for="description" class="form-label">Description</label>
                                <textarea id="description" class="form-control" rows="5" th:field="*{description}"></textarea>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 d-grid gap-2 d-sm-flex">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a th:href="@{/categories}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0">Aperçu</h5>
                        </div>
                        <div class="card-body">
                            <div class="text-muted">Nom</div>
                            <div class="fw-semibold" th:text="*{nom}"></div>
                            <div class="mt-3 text-muted">Description</div>
                            <div class="fw-semibold" th:text="${#strings.isEmpty(categorie.description) ? 'Aucune description' : categorie.description}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
