<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Organisations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">Liste des Organisations</h1>
            <a th:href="@{/organisations/create}" class="btn btn-primary">+ Nouvelle Organisation</a>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Description</th>
                            <th>Email</th>
                            <th>T&eacute;l&eacute;phone</th>
                            <th>Adresse</th>
                            <th>Statut</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="organisation : ${organisations}">
                            <td th:text="${organisation.id}"></td>
                            <td th:text="${organisation.nom}"></td>
                            <td th:text="${organisation.description}"></td>
                            <td th:text="${organisation.email}"></td>
                            <td th:text="${organisation.telephone}"></td>
                            <td th:text="${organisation.adresse}"></td>
                            <td>
                                <span th:if="${organisation.valide}" class="badge bg-success">Valid&eacute;e</span>
                                <span th:unless="${organisation.valide}" class="badge bg-warning text-dark">En attente</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2 flex-wrap justify-content-end">
                                    <a th:href="@{/organisations/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                                    <a th:href="@{/organisations/edit/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-secondary">Modifier</a>
                                    <a th:if="${not organisation.valide}" th:href="@{/organisations/valider/{id}(id=${organisation.id})}" class="btn btn-sm btn-success">Valider</a>
                                    <a th:if="${not organisation.valide}" th:href="@{/organisations/rejeter/{id}(id=${organisation.id})}" class="btn btn-sm btn-danger">Rejeter</a>
                                    <a th:href="@{/organisations/delete/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Etes-vous sur ?')">Supprimer</a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div th:if="${organisations.isEmpty()}" class="text-center py-5">
            <h3>Aucune organisation trouv&eacute;e</h3>
            <p class="text-muted">Commencez par cr&eacute;er votre premi&egrave;re organisation.</p>
            <a th:href="@{/organisations/create}" class="btn btn-primary">Cr&eacute;er une organisation</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
