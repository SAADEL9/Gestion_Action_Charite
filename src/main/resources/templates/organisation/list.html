<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head('Associations')}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">Liste des Organisations</h1>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/organisations/create}" class="btn btn-primary">Nouvelle Organisation</a>
        </div>

        <div class="row row-cols-1 row-cols-md-2 row-cols-lg-4 g-4">
            <div class="col" th:each="organisation : ${organisations}">
                <div class="card h-100 border-0 shadow-sm organisation-card position-relative"
                     th:onclick="|window.location.href='@{/organisations/{id}(id=${organisation.id})}'|"
                     style="cursor: pointer; border-radius: 18px; overflow: hidden; transition: transform 0.2s ease;">

                    <div class="position-relative">
                        <img th:src="${#strings.isEmpty(organisation.logo) ? 'https://placehold.co/600x360?text=Logo' : organisation.logo}"
                             class="card-img-top"
                             th:alt="${organisation.nom}"
                             style="height: 140px; object-fit: cover;">
                        
                        <div class="position-absolute bottom-0 start-0 m-2">
                            <span th:if="${organisation.status.name() == 'APPROVED'}" class="badge bg-success shadow-sm">ApprouvÃ©e</span>
                            <span th:if="${organisation.status.name() == 'PENDING'}" class="badge bg-warning text-dark shadow-sm">En attente</span>
                            <span th:if="${organisation.status.name() == 'REJECTED'}" class="badge bg-danger shadow-sm">RejetÃ©e</span>
                        </div>
                    </div>

                    <div class="card-body p-3 d-flex flex-column">
                        <h6 class="card-title fw-bold mb-2 text-truncate" th:text="${organisation.nom}"></h6>
                        <p class="card-text text-muted small mb-0" 
                           th:text="${#strings.abbreviate(organisation.description, 60)}"></p>

                        <!-- Admin controls overlay or separate section -->
                        <th:block sec:authorize="hasRole('ADMIN')" th:if="${organisation.status.name() == 'PENDING'}">
                            <div class="mt-3 pt-3 border-top d-flex gap-2">
                                <a th:href="@{/organisations/valider/{id}(id=${organisation.id})}"
                                   class="btn btn-xs btn-success flex-grow-1 py-1" style="font-size: 0.75rem;"
                                   onclick="event.stopPropagation();">Approuver</a>
                                <a th:href="@{/organisations/rejeter/{id}(id=${organisation.id})}"
                                   class="btn btn-xs btn-outline-danger flex-grow-1 py-1" style="font-size: 0.75rem;"
                                   onclick="event.stopPropagation(); return confirm('Rejeter ?')">Rejeter</a>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${organisations.isEmpty()}" class="text-center py-5">
            <h3>Aucune organisation trouv&eacute;e</h3>
            <p class="text-muted">Commencez par cr&eacute;er votre premi&egrave;re organisation.</p>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/organisations/create}" class="btn btn-primary">Cr&eacute;er une organisation</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
