<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Organisations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">Liste des Organisations</h1>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/organisations/create}" class="btn btn-primary">Nouvelle Organisation</a>
        </div>

        <div class="row g-4">
            <div class="col-md-4 col-lg-3" th:each="organisation : ${organisations}">

                <div class="card h-100 shadow-sm organisation-card"
                     th:onclick="|window.location.href='@{/organisations/{id}(id=${organisation.id})}'|"
                     style="cursor: pointer;">

                    <!-- LOGO -->
                    <img th:src="@{${organisation.logo}}"
                         class="card-img-top"
                         alt="Logo"
                         style="height: 180px; object-fit: cover;">

                    <div class="card-body d-flex flex-column">

                        <!-- NAME -->
                        <h5 class="card-title fw-bold" th:text="${organisation.nom}"></h5>

                        <!-- DESCRIPTION -->
                        <p class="card-text text-muted"
                           th:text="${#strings.abbreviate(organisation.description, 80)}"></p>

                        <!-- STATUS -->
                        <div class="mt-auto">
                    <span th:if="${organisation.status.name() == 'APPROVED'}"
                          class="badge bg-success">Approuvée</span>

                            <span th:if="${organisation.status.name() == 'PENDING'}"
                                  class="badge bg-warning text-dark">En attente</span>

                            <span th:if="${organisation.status.name() == 'REJECTED'}"
                                  class="badge bg-danger">Rejetée</span>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div th:if="${organisations.isEmpty()}" class="text-center py-5">
            <h3>Aucune organisation trouv&eacute;e</h3>
            <p class="text-muted">Commencez par cr&eacute;er votre premi&egrave;re organisation.</p>
            <a sec:authorize="hasAnyRole('ORG_ADMIN', 'ADMIN')" th:href="@{/organisations/create}" class="btn btn-primary">Cr&eacute;er une organisation</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
