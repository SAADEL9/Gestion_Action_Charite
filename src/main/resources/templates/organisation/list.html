<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste des Organisations</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div th:replace="layout/navbar :: navbar"></div>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Liste des Organisations</h1>
            <a th:href="@{/organisations/create}" class="btn btn-primary">+ Nouvelle Organisation</a>
        </div>

        <!-- Organisations Table -->
        <div class="table-responsive">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Description</th>
                        <th>Email</th>
                        <th>Téléphone</th>
                        <th>Adresse</th>
                        <th>Statut</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="organisation : ${organisations}">
                        <td th:text="${organisation.id}"></td>
                        <td th:text="${organisation.nom}"></td>
                        <td th:text="${organisation.description}"></td>
                        <td th:text="${organisation.email}"></td>
                        <td th:text="${organisation.telephone}"></td>
                        <td th:text="${organisation.adresse}"></td>
                        <td>
                            <span th:if="${organisation.valide}" class="badge bg-success">Validée</span>
                            <span th:unless="${organisation.valide}" class="badge bg-warning">En attente</span>
                        </td>
                        <td>
                            <a th:href="@{/organisations/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-primary">Voir</a>
                            <a th:href="@{/organisations/edit/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-secondary">Modifier</a>
                            <div th:if="${not organisation.valide}">
                                <a th:href="@{/organisations/valider/{id}(id=${organisation.id})}" class="btn btn-sm btn-success">Valider</a>
                                <a th:href="@{/organisations/rejeter/{id}(id=${organisation.id})}" class="btn btn-sm btn-danger">Rejeter</a>
                            </div>
                            <a th:href="@{/organisations/delete/{id}(id=${organisation.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Êtes-vous sûr ?')">Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- No results message -->
        <div th:if="${organisations.isEmpty()}" class="text-center py-5">
            <h3>Aucune organisation trouvée</h3>
            <p>Commencez par créer votre première organisation.</p>
            <a th:href="@{/organisations/create}" class="btn btn-primary">Créer une organisation</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
