<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${organisation != null and organisation.id != null ? 'Modifier organisation' : 'Nouvelle organisation'})}"></head>
<body class="public-page">
<div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <h1 class="page-title mb-4" th:text="${organisation != null and organisation.id != null ? 'Modifier organisation' : 'Nouvelle organisation'}"></h1>

        <form th:action="${organisation != null and organisation.id != null ? '/organisations/edit/' + organisation.id : '/organisations/create'}"
              th:object="${organisation}" method="post" class="needs-validation" novalidate  enctype="multipart/form-data">
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="mb-3">
                                <label for="nom" class="form-label">Nom *</label>
                                <input id="nom" class="form-control" type="text" th:field="*{nom}" required>
                                <div class="invalid-feedback">Veuillez fournir un nom.</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email</label>
                                        <input id="email" class="form-control" type="email" th:field="*{email}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="telephone" class="form-label">T&eacute;l&eacute;phone</label>
                                        <input id="telephone" class="form-control" type="text" th:field="*{telephone}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="adresse" class="form-label">Adresse</label>
                                <input id="adresse" class="form-control" type="text" th:field="*{adresse}">
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="adresseLegal" class="form-label">Adresse l&eacute;gale</label>
                                        <input id="adresseLegal" class="form-control" type="text" th:field="*{adresseLegal}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="numeroFiscal" class="form-label">Num&eacute;ro fiscal</label>
                                        <input id="numeroFiscal" class="form-control" type="text" th:field="*{numeroFiscal}">
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="contactPrincipal" class="form-label">Contact principal</label>
                                        <input id="contactPrincipal" class="form-control" type="text" th:field="*{contactPrincipal}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="logo" class="form-label">Logo</label>
                                        <input id="logo" class="form-control" type="file" name="logoFile" accept="image/*">
                                        <div th:if="${organisation != null and organisation.logo != null}" class="mt-2">
                                            <img th:src="${organisation.logo}" style="max-height: 80px;">
                                            <small class="text-muted d-block">Logo actuel</small>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <div class="mb-3">
                                        <label for="coverFile" class="form-label">Image de couverture (1200x220 recommand&eacute;)</label>
                                        <input id="coverFile" class="form-control" type="file" name="coverFile" accept="image/*">
                                        <div th:if="${organisation != null and organisation.coverImage != null}" class="mt-2">
                                            <img th:src="${organisation.coverImage}" style="max-height: 120px; width: 100%; object-fit: cover;">
                                            <small class="text-muted d-block">Couverture actuelle</small>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea id="description" class="form-control" rows="4" th:field="*{description}"></textarea>
                            </div>

                        </div>
                    </div>

                    <div class="mt-3 d-grid gap-2 d-sm-flex">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a th:href="@{/organisations}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0">Apercu</h5>
                        </div>
                        <div class="card-body">
                            <div class="text-muted">Nom</div>
                            <div class="fw-semibold" th:text="*{nom}"></div>
                            <div class="mt-3 text-muted">Email</div>
                            <div class="fw-semibold" th:text="*{email}"></div>
                            <div class="mt-3 text-muted">Statut</div>
                            <div class="fw-semibold" th:text="${organisation != null and organisation.status != null ? organisation.status : 'Attribue automatiquement'}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
