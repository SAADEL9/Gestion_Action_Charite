<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D&eacute;tail utilisateur</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
    <div th:replace="~{layout/navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0">D&eacute;tail utilisateur</h1>
            <div class="d-flex gap-2">
                <a th:href="@{/users}" class="btn btn-outline-secondary">Retour</a>
                <a th:if="${user != null}" th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-primary">Modifier</a>
            </div>
        </div>

        <div th:if="${user == null}" class="alert alert-warning">Utilisateur introuvable.</div>
        <div th:if="${param.requested}" class="alert alert-success">Demande envoy&eacute;e. Un administrateur peut maintenant l'approuver.</div>

        <div th:if="${user != null}" class="row g-4">
            <div class="col-lg-8">
                <div class="card">
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <div class="text-muted">Nom</div>
                                <div class="fw-semibold" th:text="${user.nom}"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Pr&eacute;nom</div>
                                <div class="fw-semibold" th:text="${user.prenom}"></div>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-6">
                                <div class="text-muted">Email</div>
                                <div class="fw-semibold" th:text="${user.email}"></div>
                            </div>
                            <div class="col-md-6">
                                <div class="text-muted">Role</div>
                                <div><span class="badge bg-secondary" th:text="${user.role}"></span></div>
                            </div>
                            <div class="col-md-6 mt-3">
                                <div class="text-muted">Demande organisation</div>
                                <div>
                                    <span th:if="${user.organisationRequestPending}" class="badge bg-warning text-dark">En attente</span>
                                    <span th:unless="${user.organisationRequestPending}" class="text-muted">Aucune demande</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card">
                    <div class="card-header bg-transparent">
                        <h5 class="card-title mb-0">Actions</h5>
                    </div>
                    <div class="card-body d-grid gap-2">
                        <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-outline-primary">Modifier</a>
                        <form th:if="${#authentication.name == user.email and user.role.name() == 'USER' and !user.organisationRequestPending}"
                              th:action="@{/users/me/request-organisation}" method="post">
                            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                            <button type="submit" class="btn btn-success w-100">Demander un acc&egrave;s organisation</button>
                        </form>
                        <div th:if="${#authentication.name == user.email and user.organisationRequestPending}" class="alert alert-warning mb-0">
                            Demande d&eacute;j&agrave; envoy&eacute;e.
                        </div>
                        <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-outline-danger"
                           onclick="return confirm('Etes-vous sur ?')">Supprimer</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
