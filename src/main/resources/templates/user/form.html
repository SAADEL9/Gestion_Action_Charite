<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/head :: head(${user != null and user.id != null ? 'Modifier utilisateur' : 'Nouvel utilisateur'})}"></head>
<body class="public-page">
    <div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <h1 class="page-title mb-4" th:text="${user != null and user.id != null ? 'Modifier utilisateur' : 'Nouvel utilisateur'}"></h1>

        <form th:action="${user != null and user.id != null ? '/users/edit/' + user.id : '/users/create'}"
              th:object="${user}" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="nom">Nom *</label>
                                        <input id="nom" class="form-control" type="text" th:field="*{nom}" required>
                                        <div class="invalid-feedback">Veuillez fournir un nom.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="prenom">Pr&eacute;nom *</label>
                                        <input id="prenom" class="form-control" type="text" th:field="*{prenom}" required>
                                        <div class="invalid-feedback">Veuillez fournir un pr&eacute;nom.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email">Email *</label>
                                <input id="email" class="form-control" type="email" th:field="*{email}" required>
                                <div class="invalid-feedback">Veuillez fournir un email.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="motDePasse">Mot de passe</label>
                                <input id="motDePasse" class="form-control" type="password" th:field="*{motDePasse}">
                                <div class="form-text">Laissez vide si vous ne souhaitez pas le changer.</div>
                            </div>

                            <div class="mb-0">
                                <label class="form-label" for="role">Role</label>
                                <select id="role" class="form-select" th:field="*{role}">
                                    <option value="USER">USER</option>
                                    <option value="ORG_ADMIN">ORG_ADMIN</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 d-grid gap-2 d-sm-flex">
                        <button type="submit" class="btn btn-primary">Enregistrer</button>
                        <a th:href="@{/users}" class="btn btn-outline-secondary">Annuler</a>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0">Apercu</h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text mb-0">
                                <strong>Nom:</strong> <span th:text="*{nom}"></span><br>
                                <strong>Prenom:</strong> <span th:text="*{prenom}"></span><br>
                                <strong>Email:</strong> <span th:text="*{email}"></span><br>
                                <strong>Role:</strong> <span th:text="*{role}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) {
                        event.preventDefault()
                        event.stopPropagation()
                    }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
