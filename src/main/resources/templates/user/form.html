<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}">
<head th:with="pageTitle=${user != null and user.id != null} ? #{user.form.title.edit} : #{user.form.title.create}"
      th:replace="~{fragments/head :: head(${pageTitle})}"></head>
<body class="public-page">
    <div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <h1 class="page-title mb-4"
            th:text="${user != null and user.id != null} ? #{user.form.title.edit} : #{user.form.title.create}">Utilisateur</h1>

        <form th:action="${user != null and user.id != null ? '/users/edit/' + user.id : '/users/create'}"
              th:object="${user}" method="post" class="needs-validation" novalidate>
            <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <div class="row g-4">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="nom" th:text="#{user.form.nom}">Nom *</label>
                                        <input id="nom" class="form-control" type="text" th:field="*{nom}" required>
                                        <div class="invalid-feedback" th:text="#{user.form.nom.required}">Veuillez fournir un nom.</div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="prenom" th:text="#{user.form.prenom}">Prénom *</label>
                                        <input id="prenom" class="form-control" type="text" th:field="*{prenom}" required>
                                        <div class="invalid-feedback" th:text="#{user.form.prenom.required}">Veuillez fournir un prénom.</div>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="email" th:text="#{user.form.email}">Email *</label>
                                <input id="email" class="form-control" type="email" th:field="*{email}" required>
                                <div class="invalid-feedback" th:text="#{user.form.email.required}">Veuillez fournir un email.</div>
                            </div>

                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="telephone" th:text="#{user.form.telephone}">Téléphone</label>
                                        <input id="telephone" class="form-control" type="text" th:field="*{telephone}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label class="form-label" for="photoProfil" th:text="#{user.form.photo}">URL Photo de Profil</label>
                                        <input id="photoProfil" class="form-control" type="text" th:field="*{photoProfil}">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="adresse" th:text="#{user.form.adresse}">Adresse</label>
                                <textarea id="adresse" class="form-control" rows="2" th:field="*{adresse}"></textarea>
                            </div>

                            <div class="mb-3" sec:authorize="hasRole('ADMIN')">
                                <label class="form-label" for="motDePasse" th:text="#{user.form.password}">Mot de passe</label>
                                <input id="motDePasse" class="form-control" type="password" name="motDePasse">
                                <div class="form-text" th:text="#{user.form.password.hint}">Laissez vide si vous ne souhaitez pas le changer.</div>
                            </div>

                            <div class="mb-0" sec:authorize="hasRole('ADMIN')">
                                <label class="form-label" for="role" th:text="#{user.form.role}">Rôle</label>
                                <select id="role" class="form-select" th:field="*{role}">
                                    <option value="USER">USER</option>
                                    <option value="ORG_ADMIN">ORG_ADMIN</option>
                                    <option value="ADMIN">ADMIN</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="mt-3 d-grid gap-2 d-sm-flex">
                        <button type="submit" class="btn btn-primary" th:text="#{user.form.save}">Enregistrer</button>
                        <a th:href="@{/users}" class="btn btn-outline-secondary" th:text="#{user.form.cancel}">Annuler</a>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card">
                        <div class="card-header bg-transparent">
                            <h5 class="card-title mb-0" th:text="#{user.form.preview}">Aperçu</h5>
                        </div>
                        <div class="card-body">
                            <p class="card-text mb-0">
                                <strong th:text="#{user.table.nom}">Nom</strong>: <span th:text="*{nom}"></span><br>
                                <strong th:text="#{user.table.prenom}">Prénom</strong>: <span th:text="*{prenom}"></span><br>
                                <strong th:text="#{user.table.email}">Email</strong>: <span th:text="*{email}"></span><br>
                                <strong th:text="#{user.form.telephone}">Téléphone</strong>: <span th:text="*{telephone}"></span><br>
                                <strong th:text="#{user.form.role}">Rôle</strong>: <span th:text="*{role}"></span>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            'use strict'
            var forms = document.querySelectorAll('.needs-validation')
            Array.prototype.slice.call(forms).forEach(function (form) {
                form.addEventListener('submit', function (event) {
                    if (!form.checkValidity()) { event.preventDefault(); event.stopPropagation(); }
                    form.classList.add('was-validated')
                }, false)
            })
        })()
    </script>
</body>
</html>
