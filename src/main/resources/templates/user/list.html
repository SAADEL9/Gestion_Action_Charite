<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:lang="${#locale.language}"
      th:dir="${#locale.language == 'ar' ? 'rtl' : 'ltr'}">
<head th:replace="~{fragments/head :: head(#{user.list.title})}"></head>
<body class="public-page">
    <div th:replace="~{fragments/public-navbar :: navbar}"></div>

    <main class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="page-title mb-0" th:text="#{user.list.title}">Liste des utilisateurs</h1>
            <a th:href="@{/users/create}" class="btn btn-primary" th:text="#{user.add}">+ Ajouter un utilisateur</a>
        </div>

        <div class="card">
            <div class="table-responsive">
                <table class="table table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th th:text="#{user.table.id}">ID</th>
                            <th th:text="#{user.table.nom}">Nom</th>
                            <th th:text="#{user.table.prenom}">Prénom</th>
                            <th th:text="#{user.table.email}">Email</th>
                            <th th:text="#{user.table.role}">Rôle</th>
                            <th th:text="#{user.table.org.request}">Demande org.</th>
                            <th class="text-end" th:text="#{user.table.actions}">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td th:text="${user.id}"></td>
                            <td th:text="${user.nom}"></td>
                            <td th:text="${user.prenom}"></td>
                            <td th:text="${user.email}"></td>
                            <td><span class="badge bg-secondary" th:text="${user.role}"></span></td>
                            <td>
                                <span th:if="${user.organisationRequestPending}" class="badge bg-warning text-dark" th:text="#{user.request.pending}">En attente</span>
                                <span th:unless="${user.organisationRequestPending}" class="text-muted">-</span>
                            </td>
                            <td class="text-end">
                                <div class="d-inline-flex gap-2">
                                    <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary" th:text="#{user.view}">Voir</a>
                                    <a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-secondary" th:text="#{user.edit}">Modifier</a>
                                    <form th:if="${user.organisationRequestPending}"
                                          th:action="@{/users/{id}/approve-organisation(id=${user.id})}"
                                          method="post" class="d-inline">
                                        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                                        <button type="submit" class="btn btn-sm btn-success" th:text="#{user.approve.org}">Approuver org.</button>
                                    </form>
                                    <a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger"
                                       th:onclick="'return confirm(\'' + #{user.delete.confirm} + '\')'">
                                        <span th:text="#{user.delete}">Supprimer</span>
                                    </a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
