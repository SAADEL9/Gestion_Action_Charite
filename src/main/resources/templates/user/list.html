<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title> Utilisateurs</title>
</head>
<body>
<h1>Liste des utilisateurs</h1>
<a href="/users/create">+ Ajouter un utilisateur</a>
<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prénom</th>
        <th>Email</th>
        <th>Role</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.nom}"></td>
        <td th:text="${user.prenom}"></td>
        <td th:text="${user.email}"></td>
        <td th:text="${user.role}"></td>
        <td>
            <a th:href="@{/users/edit/{id}(id=${user.id})}">Modifier</a>
            <a th:href="@{/users/delete/{id}(id=${user.id})}">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
