<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navbar" class="site-header">
    <style>
        .navbar-brand img {
            height: 36px !important;
            width: auto !important;
            max-height: 36px !important;
            object-fit: unset !important;
            display: inline !important;
        }
    </style>
    <nav class="navbar navbar-expand-xl navbar-light">
        <div class="container-xxl px-4 px-md-5">
            <a class="navbar-brand brand-mark" th:href="@{/}">
                <img th:src="@{/images/logo-charite.png}" alt="Charite">
                <span>Charite</span>
            </a>

            <button class="navbar-toggler shadow-none border-0" type="button"
                    data-bs-toggle="collapse" data-bs-target="#publicNavbar"
                    aria-controls="publicNavbar" aria-expanded="false"
                    th:attr="aria-label=#{nav.home}">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="publicNavbar">
                <ul class="navbar-nav mx-auto align-items-xl-center gap-xl-3">
                    <li class="nav-item"><a class="nav-link active" th:href="@{/}" th:text="#{nav.home}">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/actions}" th:text="#{nav.explore}">Explorer</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/organisations}" th:text="#{nav.associations}">Associations</a></li>
                </ul>

                <div class="d-flex align-items-center gap-2 header-actions">
                    <!-- Sélecteur de langue -->
                    <div class="dropdown">
                        <button class="btn btn-lang dropdown-toggle" type="button"
                                data-bs-toggle="dropdown" aria-expanded="false"
                                th:text="${#locale.language == 'ar' ? 'AR' : 'FR'}">FR</button>
                        <ul class="dropdown-menu dropdown-menu-end">
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=fr)}" th:text="#{nav.lang.fr}">FR</a>
                            </li>
                            <li>
                                <a class="dropdown-item" th:href="@{/(lang=ar)}" th:text="#{nav.lang.ar}">AR | عربي</a>
                            </li>
                        </ul>
                    </div>

                    <a sec:authorize="isAnonymous()" th:href="@{/login}"
                       class="btn btn-ghost" th:text="#{nav.login}">Se connecter</a>
                    <a sec:authorize="isAnonymous()" th:href="@{/register}"
                       class="btn btn-success-pill" th:text="#{nav.register}">S'inscrire</a>

                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <button class="btn btn-soft dropdown-toggle d-flex align-items-center gap-2"
                                type="button" data-bs-toggle="dropdown">
                            <i class="bi bi-person-circle fs-5"></i>
                            <span sec:authentication="principal.fullName">Utilisateur</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 py-2" th:href="@{/users/me}">
                                    <i class="bi bi-person"></i>
                                    <span th:text="#{nav.profile}">Mon Profil</span>
                                </a>
                            </li>
                            <li sec:authorize="hasRole('ADMIN')">
                                <a class="dropdown-item d-flex align-items-center gap-2 py-2" th:href="@{/admin/dashboard}">
                                    <i class="bi bi-speedometer2"></i>
                                    <span th:text="#{nav.admin.dashboard}">Dashboard Admin</span>
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="mb-0">
                                    <button type="submit" class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger">
                                        <i class="bi bi-box-arrow-right"></i>
                                        <span th:text="#{nav.logout}">Déconnexion</span>
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
