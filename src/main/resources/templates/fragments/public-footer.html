<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<footer th:fragment="footer" class="site-footer">
    <div class="footer-card rounded-0 border-start-0 border-end-0 border-bottom-0">
        <div class="container-xxl px-4 px-md-5">
            <div class="row g-4">
                <div class="col-lg-5">
                    <div class="brand-mark mb-3">
                        <img th:src="@{/images/logo-charite.png}" alt="Charite">
                        <span>Charite</span>
                    </div>
                    <p class="footer-copy mb-0" th:text="#{footer.desc}">Plateforme digitale pour connecter associations, donateurs et bénévoles.</p>
                </div>
                <div class="col-lg-4">
                    <h5 class="footer-title mb-3" th:text="#{footer.contact}">Contactez-nous</h5>
                    <ul class="list-unstyled text-muted small mb-0">
                        <li class="mb-2"><i class="bi bi-geo-alt me-2"></i> <span th:text="#{footer.address}">123 Rue de la Solidarité, Casablanca</span></li>
                        <li class="mb-2"><i class="bi bi-envelope me-2"></i> <span th:text="#{footer.email}">contact@charite.org</span></li>
                        <li><i class="bi bi-telephone me-2"></i> <span th:text="#{footer.phone}">+212 614 52 41 021</span></li>
                    </ul>
                </div>
                <div class="col-lg-3">
                    <h5 class="footer-title mb-3" th:text="#{footer.links}">Liens rapides</h5>
                    <div class="d-flex flex-column gap-2 text-muted small">
                        <a href="#" class="footer-link" th:text="#{footer.privacy}">Confidentialité</a>
                        <a href="#" class="footer-link" th:text="#{footer.legal}">Mentions légales</a>
                        <a href="#" class="footer-link" th:text="#{footer.support}">Support</a>
                    </div>
                </div>
            </div>
            <hr class="my-4 line-soft">
            <div class="text-center text-muted small" th:text="#{footer.copyright}">
                &copy; 2026 Charite. Tous droits réservés.
            </div>
        </div>
    </div>
</footer>
</body>
</html>
